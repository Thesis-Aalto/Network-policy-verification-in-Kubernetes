apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: makeline-service-pod-egress
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: makeline-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017