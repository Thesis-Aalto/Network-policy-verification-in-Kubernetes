apiVersion: v1
kind: Pod
metadata:
  name: web-frontend
  namespace: frontend
  labels:
    tier: frontend
spec:
  containers:
  - name: nginx-container
    image: nginx:stable-alpine
    ports:
    - containerPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: api-mock
  namespace: backend #
  labels:
    tier: backend
spec:
  containers:
  - name: apache-container
    image: httpd:alpine
    ports:
    - containerPort: 8080

---

apiVersion: v1
kind: Pod
metadata:
  name: data-store
  namespace: database
  labels:
    tier: database
spec:
  containers:
  - name: redis-container
    image: redis:7-alpine
    ports:
    - containerPort: 6379