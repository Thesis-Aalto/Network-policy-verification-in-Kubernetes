apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-selector-egress-port-mismatch
  namespace: bookinfo-services-ns
spec:
  podSelector:
    matchLabels:
      app: reviews
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: details
    ports:
    - protocol: TCP
      port: 5555 # Port mismatch: details listens on port 9080