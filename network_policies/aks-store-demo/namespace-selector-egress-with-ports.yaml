apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-selector-egress-with-ports
  namespace: backend-ns
spec:
  podSelector: {} # Applies to all pods in the backend-ns namespace
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database-ns
    ports:
    - protocol: TCP
      port: 5672 # Explicitly restricts egress traffic to RabbitMQ's port