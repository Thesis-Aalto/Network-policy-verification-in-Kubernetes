apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: calico-ingress-deny-vs-allow
  namespace: database-ns
spec:
  selector: app == 'mongodb'
  types:
  - Ingress
  ingress:
  - action: Allow
    source:
      namespaceSelector: kubernetes.io/metadata.name == 'backend-ns'
      selector: app == 'makeline-service'
  - action: Deny
    protocol: TCP
    source:
      namespaceSelector: kubernetes.io/metadata.name == 'backend-ns'
      selector: app == 'makeline-service'
    destination:
      ports:
      - 27017
