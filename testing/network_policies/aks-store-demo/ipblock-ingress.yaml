apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ipblock-ingress
  namespace: database-ns
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 172.17.0.0/16
    ports:
    - protocol: TCP
      port: 27017
