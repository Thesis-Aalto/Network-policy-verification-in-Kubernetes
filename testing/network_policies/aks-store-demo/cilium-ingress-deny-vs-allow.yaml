apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-ingress-deny-vs-allow
  namespace: database-ns
spec:
  endpointSelector:
    matchLabels:
      app: mongodb
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: backend-ns
        app: makeline-service
  ingressDeny:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: backend-ns
        app: makeline-service
    toPorts:
    - ports:
      - port: "27017"
        protocol: TCP
